 con:['그리고','그래서','하지만','그러나','그런데','그러면','그러므로','따라서','또한','그렇지만','왜냐하면','때문에','지만','니까','면서','는데','아서','어서','으면','려고','반면','그럼에도','비록','게다가','결과적으로'],

};
var cfg=CFG[code];
var db=[];
LV.forEach(function(lv){String(RAW[code][lv]||'').split(';').forEach(function(p){
  if(!p.trim())return;var i=p.indexOf('=');if(i<0)return;
  var w=p.slice(0,i).trim(),t=p.slice(i+1).trim(),b=w.replace(/^(der|die|das)\s+/,'').replace(/^sich\s+/,'');
  var k=b.toLowerCase().replace(/ß/g,'ss'),s=k;
  if(code==='de'&&b===w){if(/(eln|ern)$/.test(k)&&k.length>5)s=k.slice(0,-1);else if(/en$/.test(k)&&k.length>=5)s=k.slice(0,-2)}
  if(code==='ko'&&/다$/.test(k))s=k.slice(0,-1);
  db.push({w:w,b:b,k:k,s:s,t:t,lv:lv});
})});
var idx={},sidx={};
db.forEach(function(e){if(!idx[e.k])idx[e.k]=e;if(e.s!==e.k&&!sidx[e.s])sidx[e.s]=e});
function koLookup(lc){
  var best=null;
  db.forEach(function(e){
    var key=e.s;if(!key||lc.indexOf(key)!==0)return;
    var rest=lc.slice(key.length);
    var ok=key.length===1?/^(요|세요|어요|아요|해요|어|아|는|은|이|가|를|을|에|에서|도|의|로|와|과|만|고|서|면|지만|니까|습니다|었어요|았어요)?$/.test(rest):rest.length<=4;
    if(ok&&(!best||key.length>best.s.length))best=e;
  });
  return best;
}
function lookup(tok){
  var lc=String(tok).toLowerCase().replace(/ß/g,'ss');
  if(idx[lc])return idx[lc];
  if(code==='ko')return koLookup(lc);
  var c=code==='de'
    ?[lc.replace(/(en|er|es|e|n|s|t|st|te)$/,''),lc.replace(/(en|e|st|t|te|ten)$/,'')]
    :[lc.replace(/s$/,''),lc.replace(/es$/,''),lc.replace(/(ing|ed)$/,''),lc.replace(/(ing|ed)$/,'e'),lc.replace(/ies$/,'y'),lc.replace(/ied$/,'y')];
  for(var i=0;i<c.length;i++){if(c[i]!==lc&&c[i].length>=2){if(idx[c[i]])return idx[c[i]];if(sidx[c[i]])return sidx[c[i]]}}
  return null;
}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(lv,n){
  var min=code==='ko'?2:3;
  var pool=db.filter(function(e){return e.lv===lv&&e.s.length>=min&&e.b.indexOf(' ')<0});
  if(pool.length<n)pool=db.filter(function(e){return e.s.length>=min&&e.b.indexOf(' ')<0});
  return shuf(pool).slice(0,n);
}
function used(e,low,text){
  if(code==='ko')return text.indexOf(e.s)>-1;
  return low.some(function(w){return w.indexOf(e.s)===0});
}
function longWords(s){return String(s).match(new RegExp('[\\p{L}]{'+cfg.minw+',}','gu'))||[]}
function key(base){
  var nk=base+'_v2_'+code;
  try{if(LS&&code==='de'&&LS.getItem(nk)===null&&LS.getItem(base+'_v1')!==null)LS.setItem(nk,LS.getItem(base+'_v1'))}catch(e){}
  return nk;
}
var TITLES={speaking:{de:'Sprich mal!',en:'Speak up!',ko:'말해요!'},reading:{de:'Lies mal!',en:'Read on!',ko:'읽어요!'},writing:{de:'Schreib mal!',en:'Write it!',ko:'써요!'}};
var NAMES={de:'Deutsch',en:'English',ko:'한국어'};
window.LM={code:code,cfg:cfg,db:db,levels:LV,lookup:lookup,pick:pick,used:used,long:longWords,key:key};
var css=document.createElement('style');
css.textContent='.lm-bar{display:flex;gap:6px;margin:0 0 14px}.lm-bar button{flex:1;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#111);font:600 .95rem system-ui,sans-serif;padding:9px 6px;border-radius:12px;cursor:pointer}.lm-bar button.on{background:var(--acc,#2447d4);color:var(--onacc,#fff);border-color:var(--acc,#2447d4)}.lm-bar button:focus-visible{outline:3px solid var(--acc,#2447d4);outline-offset:2px}';
document.head.appendChild(css);
var app=document.body.getAttribute('data-app'),h1=document.querySelector('h1'),sub=document.querySelector('.sub');
if(app&&TITLES[app]){document.title=TITLES[app][code];if(h1)h1.textContent=TITLES[app][code]}
if(sub){
  var bar=document.createElement('div');bar.className='lm-bar';bar.setAttribute('role','group');bar.setAttribute('aria-label','Til');
  ['de','en','ko'].forEach(function(c){
    var b=document.createElement('button');b.type='button';b.textContent=NAMES[c];b.setAttribute('data-lang',c);
    if(c===code)b.className='on';
    b.onclick=function(){if(c===code)return;try{LS.setItem(LANGKEY,c)}catch(e){}location.reload()};
    bar.appendChild(b);
  });
  sub.parentNode.insertBefore(bar,sub.nextSibling);
}
})();

<script>
(function(){
var $=function(s){return document.querySelector(s)},LM=window.LM,KEY=LM.key('liesmal'),st={texts:[],vocab:[]};
try{var p=JSON.parse(localStorage.getItem(KEY));if(p)st=p}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(function(){t.className=''},2600)}
var DAY=864e5,INT=[0,1,2,4,8,16,32];
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY)}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=LM.cfg.sr;u.rate=.85;var v=speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf(LM.cfg.tts)===0})[0];if(v)u.voice=v;speechSynthesis.speak(u)}
function find(w){w=w.toLowerCase();for(var i=0;i<st.vocab.length;i++)if(st.vocab[i].w.toLowerCase()===w)return st.vocab[i];return null}
function sents(t){return (t.match(/[^.!?\n]+[.!?]*/g)||[]).map(function(s){return s.trim()}).filter(Boolean)}
function badges(){var d=st.vocab.filter(function(v){return v.due<=today()}).length;$('#tv').textContent='Lugʻat ('+st.vocab.length+')';$('#tr').textContent='Takrorlash ('+d+')'}

/* tabs */
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){
  closeSheet();
  document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('on',x===b)});
  ['texts','vocab','review','db'].forEach(function(id){$('#'+id).hidden=id!==b.dataset.tab});
  if(b.dataset.tab==='vocab')drawVocab();if(b.dataset.tab==='review')startReview();if(b.dataset.tab==='db')drawDb();
}});

/* texts */
function drawList(){
  var el=$('#list');
  if(!st.texts.length){el.innerHTML='<div class="empty">Hali matn yoʻq. Yuqoriga birinchi matningni qoʻy.</div>';return}
  el.innerHTML=st.texts.map(function(t,k){return'<div class="card item" data-o="'+k+'" tabindex="0"><div><b>'+esc(t.title)+'</b><br><small>'+t.level+' · '+(t.text.match(/[\p{L}]+/gu)||[]).length+' soʻz</small></div><button class="del" data-d="'+k+'" aria-label="Oʻchirish">✕</button></div>'}).join('');
}
$('#list').onclick=function(e){
  var d=e.target.closest('[data-d]');
  if(d){if(confirm('Bu matn oʻchirilsinmi?')){st.texts.splice(+d.dataset.d,1);save();drawList()}return}
  var o=e.target.closest('[data-o]');if(o)openText(+o.dataset.o);
};
$('#list').onkeydown=function(e){if(e.key==='Enter'&&!e.target.closest('.del')){var o=e.target.closest('[data-o]');if(o)openText(+o.dataset.o)}};
$('#add').onclick=function(){
  var tx=$('#tx').value.trim();if(!tx){toast('Avval matn kiriting.');return}
  st.texts.unshift({title:$('#ti').value.trim()||'Nomsiz matn',level:$('#lv').value,text:tx});
  save();$('#ti').value='';$('#tx').value='';drawList();toast('Saqlandi.');
};

/* reading */
var cur=null,tapped={},total=0;
function wrap(p){
  var re=/[\p{L}][\p{L}'’\-]*/gu,o='',last=0,m;
  while((m=re.exec(p))){o+=esc(p.slice(last,m.index));o+='<span class="w'+(find(m[0])?' sv':'')+'" data-w="'+esc(m[0])+'">'+esc(m[0])+'</span>';last=re.lastIndex}
  return o+esc(p.slice(last));
}
function openText(k){
  cur=st.texts[k];tapped={};total=(cur.text.match(/[\p{L}][\p{L}'’\-]*/gu)||[]).length;
  $('#listView').hidden=true;$('#read').hidden=false;$('#quiz').hidden=true;
  $('#body').innerHTML=cur.text.split(/\n+/).map(function(p){return'<p>'+wrap(p)+'</p>'}).join('');
  counter();window.scrollTo(0,0);
}
function counter(){
  var n=Object.keys(tapped).length,unk=(cur.text.match(/[\p{L}][\p{L}'’\-]*/gu)||[]).filter(function(w){return tapped[w.toLowerCase()]}).length,pc=total?Math.round(unk/total*100):0,c=$('#cnt');
  c.textContent=cur.level+' · '+total+' soʻz · nomaʼlum: '+n+' xil soʻz ('+pc+'% matn)'+(pc>8&&total>=30?' — matn qiyin, pastroq darajani sinab koʻr':'');
  c.className='cnt'+(pc>8&&total>=30?' warn':'');
}
$('#back').onclick=function(){closeSheet();$('#read').hidden=true;$('#listView').hidden=false;drawList()};
function ctxOf(w){var lw=w.toLowerCase();return sents(cur.text).filter(function(s){return s.toLowerCase().indexOf(lw)>-1})[0]||''}
function openSheet(w){
  var v=find(w);tapped[w.toLowerCase()]=1;counter();
  $('#sw').value=w;$('#str').value=v?v.tr:'';$('#sctx').textContent=v?v.ctx:ctxOf(w);
  $('#sv').textContent=v?'Yangilash':'Lugʻatga saqlash';
  $('#sheet').className='open';say(w);
  if(!v){var d=LM.lookup(w);if(d){$('#sw').value=d.b;$('#str').value=(d.w!==d.b?d.w.split(' ')[0]+' · ':'')+d.t}else translate(w,'uz')}
}
function translate(w,lang){
  var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair='+LM.cfg.code+'|'+lang;
  fetch(url).then(function(r){return r.json()}).then(function(j){
    var t=j&&j.responseData&&j.responseData.translatedText,good=j&&String(j.responseStatus)==='200';
    if(!t||!good||/INVALID|MYMEMORY|QUERY LENGTH|PLEASE SELECT/i.test(t)||t.toLowerCase()===w.toLowerCase()){
      if(lang==='uz'&&LM.code!=='en'){translate(w,'en');return}
      toast('Tarjima topilmadi, oʻzing yoz.');return;
    }
    if($('#sw').value===w&&!$('#str').value){$('#str').value=t;if(lang==='en')toast('Inglizcha tarjima qoʻyildi, oʻzbekchaga oʻzgartiring.')}
  }).catch(function(){toast('Tarjima olinmadi, oʻzing yoz.')});
}
function closeSheet(){$('#sheet').className=''}
$('#body').onclick=function(e){var s=e.target.closest('.w');if(s)openSheet(s.dataset.w)};
$('#cl').onclick=closeSheet;
$('#hear').onclick=function(){say($('#sw').value)};
$('#sv').onclick=function(){
  var w=$('#sw').value.trim(),t=$('#str').value.trim();
  if(!w||!t){toast('Tarjimani yoz.');return}
  var v=find(w);
  if(v){v.tr=t}else{st.vocab.push({w:w,tr:t,ctx:$('#sctx').textContent,box:0,due:today()})}
  save();badges();closeSheet();
  document.querySelectorAll('.w').forEach(function(el){if(el.dataset.w.toLowerCase()===w.toLowerCase())el.classList.add('sv')});
  toast('Saqlandi.');
};

/* comprehension quiz (cloze) */
var qs=[],qa=0,qc=0;
$('#quizBtn').onclick=function(){
  var text=cur.text,S=sents(text).filter(function(s){return s.split(/\s+/).length>=LM.cfg.sw}),pool={};
  LM.long(text).forEach(function(w){pool[w.toLowerCase()]=w});
  var keys=Object.keys(pool);
  if(S.length<2||keys.length<4){toast('Test uchun matn juda qisqa.');return}
  qs=shuf(S).slice(0,5).map(function(s){
    var ws=LM.long(s).filter(function(w){return s.indexOf(w)>0});
    if(!ws.length)return null;
    var t=ws.sort(function(a,b){return b.length-a.length})[0],pre=t.toLowerCase().slice(0,LM.cfg.pre);
    var re=new RegExp('(^|[^\\p{L}])'+t+'(?![\\p{L}])','u');
    var o=shuf(keys.filter(function(k){return k.indexOf(pre)!==0})).sort(function(a,b){return Math.abs(a.length-t.length)-Math.abs(b.length-t.length)}).slice(0,3).map(function(k){return pool[k]});
    if(o.length<2)return null;
    return{q:s.replace(re,function(m,a){return a+'_____'}),a:t,o:shuf(o.concat([t]))};
  }).filter(Boolean);
  if(!qs.length){toast('Test uchun matn mos kelmadi.');return}
  qa=0;qc=0;$('#quiz').hidden=false;drawQ();$('#quiz').scrollIntoView({behavior:'smooth'});
};
function drawQ(){
  var el=$('#quiz');
  if(qa>=qs.length){el.innerHTML='<div class="big">'+qc+' / '+qs.length+'</div><p class="hint" style="text-align:center">'+(qc>=qs.length-1?'Matnni yaxshi tushundingiz. Keyingi darajani sinab koʻring.':'Matnni yana bir marta oʻqing, nomaʼlum soʻzlarni lugʻatga saqlang.')+'</p>';return}
  var q=qs[qa];
  el.innerHTML='<div class="cnt">'+(qa+1)+' / '+qs.length+'</div><div class="q">'+esc(q.q)+'</div><div class="opts">'+q.o.map(function(x){return'<button class="opt" data-a="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
}
$('#quiz').onclick=function(e){
  var b=e.target.closest('.opt');if(!b||$('#quiz .opt.ok'))return;
  var q=qs[qa],right=b.dataset.a.toLowerCase()===q.a.toLowerCase();
  if(right)qc++;else b.classList.add('bad');
  document.querySelectorAll('#quiz .opt').forEach(function(x){if(x.dataset.a.toLowerCase()===q.a.toLowerCase())x.classList.add('ok')});
  setTimeout(function(){qa++;drawQ()},right?700:1600);
};

/* vocab list */
function drawVocab(){
  var el=$('#vlist');
  if(!st.vocab.length){el.innerHTML='<div class="empty">Lugʻat boʻsh. Matnda soʻzni bosib saqlang.</div>';return}
  el.innerHTML=st.vocab.slice().reverse().map(function(v){var k=st.vocab.indexOf(v);return'<div class="card item"><div><b>'+esc(v.w)+'</b> — '+esc(v.tr)+'<br><small>'+esc(v.ctx)+'</small></div><button class="del" data-v="'+k+'" aria-label="Oʻchirish">✕</button></div>'}).join('');
}
$('#vlist').onclick=function(e){var d=e.target.closest('[data-v]');if(d){st.vocab.splice(+d.dataset.v,1);save();badges();drawVocab()}};

/* spaced review (Leitner boxes) */
var queue=[],card=null;
function startReview(){queue=shuf(st.vocab.filter(function(v){return v.due<=today()}));nextCard()}
function nextCard(){
  badges();card=queue.shift();var el=$('#rv');
  if(!card){el.innerHTML='<div class="empty">'+(st.vocab.length?'Bugungi takrorlash tugadi. Barakalla!':'Avval matndan soʻz saqlang.')+'</div>';return}
  el.innerHTML='<div class="cnt">Qolgan: '+(queue.length+1)+'</div><div class="big">'+esc(card.w)+'</div><div class="ctx">'+esc(card.ctx)+'</div><div id="ans"></div><div class="ctrl"><button class="btn" id="hr">🔊</button><button class="btn pri" id="show">Koʻrsat</button></div>';
  $('#hr').onclick=function(){say(card.w)};
  $('#show').onclick=function(){
    $('#ans').innerHTML='<div class="tr">'+esc(card.tr)+'</div>';
    var c=document.querySelector('#rv .ctrl');
    c.innerHTML='<button class="btn" id="no">Bilmadim</button><button class="btn pri" id="yes">Bildim</button>';
    $('#yes').onclick=function(){card.box=Math.min(card.box+1,6);card.due=today()+INT[card.box];save();nextCard()};
    $('#no').onclick=function(){card.box=0;card.due=today();queue.push(card);save();nextCard()};
  };
}

/* lugʻat bazasi */
var blv='A1';
function drawDb(){
  $('#bchips').innerHTML=LM.levels.map(function(l){return'<button class="chip'+(l===blv?' on':'')+'" data-l="'+l+'">'+l+'</button>'}).join('');
  var rows=LM.db.filter(function(e){return e.lv===blv});
  $('#blist').innerHTML=rows.map(function(e){var has=!!find(e.b);return'<div class="card item"><div><b>'+esc(e.w)+'</b> — '+esc(e.t)+'</div><button class="btn'+(has?'':' pri')+'" style="margin-left:auto" data-b="'+esc(e.w)+'"'+(has?' disabled':'')+' aria-label="Lugʻatga qoʻsh">'+(has?'✓':'＋')+'</button></div>'}).join('');
}
function addEntry(e){if(!find(e.b)){st.vocab.push({w:e.b,tr:e.t,ctx:e.w!==e.b?e.w:'',box:0,due:today()});return 1}return 0}
$('#bchips').onclick=function(e){var c=e.target.closest('[data-l]');if(c){blv=c.dataset.l;drawDb()}};
$('#blist').onclick=function(e){
  var b=e.target.closest('[data-b]');if(!b)return;
  var en=LM.db.filter(function(x){return x.w===b.dataset.b&&x.lv===blv})[0];
  if(en&&addEntry(en)){save();badges();drawDb()}
};
$('#ball').onclick=function(){
  var n=0;LM.db.filter(function(x){return x.lv===blv}).forEach(function(x){n+=addEntry(x)});
  save();badges();drawDb();toast(n?n+' ta soʻz qoʻshildi.':'Hammasi allaqachon lugʻatda.');
};
(function(){
  var sl=$('#pk');
  sl.innerHTML='<option value="">— tanlang —</option>'+LM.cfg.sample.map(function(p,i){return'<option value="'+i+'">'+esc(p.t)+'</option>'}).join('');
  sl.onchange=function(){var p=LM.cfg.sample[+sl.value];if(p){$('#ti').value=p.t;$('#lv').value=p.lv;$('#tx').value=p.tx}};
})();
drawList();badges();
if('speechSynthesis' in window)speechSynthesis.getVoices();
})();
</script>
</body>
